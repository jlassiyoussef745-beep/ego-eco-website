<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EGO & ECO — Crois en toi. Petits prix. Livré partout en Tunisie</title>
<meta name="description" content="EGO & ECO : vêtements et accessoires pour ceux qui se choisissent d'abord. Tout à moins de 50 TND. Paiement à la livraison.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;700&family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#26343F;--paper:#F5F7F7;--eco:#3F6F5E;--eco-l:#E4EFE8;--yel:#CFE3D8;--ego:#4F6E8A;--ego-l:#E3ECF3;--line:#DCE3E3;--r:10px}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font:16px/1.6 'DM Sans',system-ui,sans-serif;color:var(--ink);background:var(--paper)}
[dir=rtl] body{font-family:'Cairo','DM Sans',sans-serif}
h1,h2,h3,.logo{font-weight:400;font-family:'DM Serif Display','Cairo',sans-serif;line-height:1.1}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ego);outline-offset:2px}
.wrap{max-width:1100px;margin:auto;padding:0 20px}

/* header */
header{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;height:64px}
.logo{font-size:1.5rem;font-weight:400;text-decoration:none}
.logo b{color:var(--ego)}.logo i{background:var(--yel);color:var(--ink);padding:0 5px;border-radius:4px;font-style:normal}
nav{margin-inline-start:auto;display:flex;gap:20px;align-items:center}
nav a{text-decoration:none;font-weight:500}
nav a:hover{color:var(--eco)}
.btn{border:2px solid var(--ink);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:hover{background:var(--eco);border-color:var(--eco);color:#fff}
.lang{padding:6px 12px;font-size:.9rem}
#cartBtn{position:relative}
#count{background:var(--ego);color:#fff;border-radius:99px;padding:0 8px;margin-inline-start:6px;font-size:.85rem}
@media(max-width:700px){nav a.hide{display:none}}

/* hero: the ego/eco split */
.hero{display:grid;grid-template-columns:1fr 1fr;min-height:70vh}
.half{padding:12vh 5vw;display:flex;flex-direction:column;justify-content:center;gap:16px}
.half h1{font-size:clamp(3.4rem,10vw,7rem);font-weight:400;letter-spacing:-.01em}
.half p{max-width:26ch;font-size:1.25rem;font-weight:500}
.h-ego{background:var(--ego);color:#fff}
.h-eco{background:var(--yel);color:var(--ink)}
.h-eco .btn{background:var(--ink);border-color:var(--ink)}.h-eco .btn:hover{background:var(--ego);border-color:var(--ego)}
.h-ego .btn{background:#fff;color:var(--ego);border-color:#fff}
.h-ego .btn:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
@media(max-width:700px){.hero{grid-template-columns:1fr}.half{padding:8vh 24px}}

/* trust strip */
.trust{background:var(--ink);color:#fff}
.trust .wrap{display:flex;flex-wrap:wrap;gap:12px 32px;justify-content:center;padding:14px 20px;font-size:.95rem}

section{padding:64px 0}
h2{font-size:clamp(1.8rem,4vw,2.6rem);margin-bottom:28px}

/* products */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.pic{aspect-ratio:4/5;display:grid;place-items:center;padding:24px;text-align:center;font:400 2rem/1.2 'DM Serif Display','Cairo',sans-serif;letter-spacing:-.02em;position:relative}
.badge{position:absolute;top:12px;inset-inline-end:12px;background:var(--yel);color:var(--ink);font:700 .85rem 'DM Sans','Cairo',sans-serif;padding:3px 10px;border-radius:99px;letter-spacing:0}
.card .in{padding:14px 16px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:1.1rem}
.tag{font-size:.85rem;color:var(--eco)}
.price{font-weight:700;margin-top:auto;font-size:1.1rem}
.card .btn{margin-top:10px;width:100%}

/* about + faq */
.two{display:grid;grid-template-columns:1fr 1fr;gap:40px}
@media(max-width:700px){.two{grid-template-columns:1fr}}
.about{background:var(--eco-l)}
details{border-bottom:1px solid var(--line);padding:14px 0}
summary{font-weight:700;cursor:pointer}
details p{margin-top:8px}

/* footer */
footer{background:var(--ink);color:#cfd6d1;padding:48px 0 28px}
footer .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:28px}
footer h3{color:#fff;font-size:1rem;margin-bottom:10px}
footer a{display:block;text-decoration:none;padding:2px 0}
footer a:hover{color:#fff}
.copy{margin-top:32px;font-size:.85rem;opacity:.7}

/* cart drawer */
#drawer{position:fixed;inset:0 0 0 auto;width:min(420px,100%);background:#fff;z-index:40;transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.15)}
[dir=rtl] #drawer{inset:0 auto 0 0;transform:translateX(-105%);box-shadow:8px 0 30px rgba(0,0,0,.15)}
#drawer.open{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.dh button{background:none;border:0;font-size:1.6rem}
.db{padding:16px 20px;overflow:auto;flex:1}
.line{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.line span.n{flex:1}
.q{display:flex;align-items:center;gap:6px}
.q button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:#fff}
.sum{padding:14px 20px;border-top:1px solid var(--line);background:var(--paper)}
.sum div{display:flex;justify-content:space-between}
.sum .tot{font-weight:700;font-size:1.15rem}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;display:none}
#ov.open{display:block}

/* checkout */
form{display:grid;gap:12px;padding:16px 20px}
label{font-size:.9rem;font-weight:500;display:grid;gap:4px}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid #b9c0b8;border-radius:8px;width:100%;background:#fff}
.cod{background:var(--eco-l);border-radius:8px;padding:10px 12px;font-size:.9rem}
.msg{padding:0 20px 16px;color:var(--eco);font-weight:700}
.err{color:#b3261e}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="logo" href="#top"><b>EGO</b> & <i>ECO</i></a>
    <nav>
      <a class="hide" href="#shop" data-i="nav_shop"></a>
      <a class="hide" href="#about" data-i="nav_about"></a>
      <a class="hide" href="#faq" data-i="nav_faq"></a>
      <button class="btn ghost lang" id="langBtn" aria-label="Langue / اللغة">العربية</button>
      <button class="btn" id="cartBtn"><span data-i="cart"></span><span id="count">0</span></button>
    </nav>
  </div>
</header>

<main id="top">
  <div class="hero">
    <div class="half h-ego">
      <h1>EGO</h1>
      <p data-i="hero_ego"></p>
      <div><a class="btn" href="#shop" data-i="cta"></a></div>
    </div>
    <div class="half h-eco">
      <h1>ECO</h1>
      <p data-i="hero_eco"></p>
      <div><a class="btn" href="#about" data-i="cta2"></a></div>
    </div>
  </div>

  <div class="trust"><div class="wrap">
    <span data-i="t1"></span><span data-i="t2"></span><span data-i="t3"></span>
  </div></div>

  <section id="shop"><div class="wrap">
    <h2 data-i="nav_shop"></h2>
    <div class="grid" id="products"></div>
  </div></section>

  <section id="about" class="about"><div class="wrap two">
    <div><h2 data-i="about_h"></h2></div>
    <div><p data-i="about_p1"></p><br><p data-i="about_p2"></p></div>
  </div></section>

  <section id="faq"><div class="wrap" style="max-width:760px">
    <h2 data-i="nav_faq"></h2>
    <details><summary data-i="f1q"></summary><p data-i="f1a"></p></details>
    <details><summary data-i="f2q"></summary><p data-i="f2a"></p></details>
    <details><summary data-i="f3q"></summary><p data-i="f3a"></p></details>
    <details><summary data-i="f4q"></summary><p data-i="f4a"></p></details>
  </div></section>
</main>

<footer id="contact"><div class="wrap">
  <div class="cols">
    <div><h3 class="logo"><span style="color:#AFC6D9">EGO</span> & <span style="color:#CFE3D8">ECO</span></h3><p data-i="foot_tag"></p></div>
    <div><h3 data-i="contact"></h3>
      <a href="https://wa.me/21620000000" target="_blank" rel="noopener">WhatsApp : +216 20 000 000</a>
      <a href="mailto:contact@egoeco.tn">contact@egoeco.tn</a>
      <span data-i="addr"></span></div>
    <div><h3 data-i="follow"></h3>
      <a href="https://instagram.com/egoeco.tn" target="_blank" rel="noopener">Instagram</a>
      <a href="https://facebook.com/egoeco.tn" target="_blank" rel="noopener">Facebook</a>
      <a href="https://tiktok.com/@egoeco.tn" target="_blank" rel="noopener">TikTok</a></div>
  </div>
  <p class="copy">© 2026 EGO & ECO · <span data-i="legal"></span></p>
</div></footer>

<!-- cart / checkout drawer -->
<div id="ov"></div>
<aside id="drawer" aria-label="Panier">
  <div class="dh"><h3 id="dtitle"></h3><button id="close" aria-label="Fermer">×</button></div>
  <div class="db" id="cartBody"></div>
  <div class="sum" id="sum"></div>
  <form id="form" hidden>
    <label><span data-i="f_name"></span><input name="name" required autocomplete="name"></label>
    <label><span data-i="f_phone"></span><input name="phone" required inputmode="numeric" pattern="[0-9]{8}" maxlength="8" placeholder="2X XXX XXX" autocomplete="tel-national"></label>
    <label><span data-i="f_gov"></span><select name="gov" required id="gov"></select></label>
    <label><span data-i="f_addr"></span><textarea name="addr" rows="2" required></textarea></label>
    <div class="cod" data-i="cod"></div>
    <button class="btn" type="submit" data-i="order"></button>
  </form>
  <div class="msg" id="msg"></div>
</aside>

<script>
/* ============ CONFIG — edit these ============ */
const WHATSAPP = "21620000000";   // your number, no + or spaces
const FREE_SHIPPING_FROM = 100;   // TND
const SHIPPING = 8;               // TND
const PRODUCTS = [
  {id:1, fr:"T-shirt",    ar:"تيشورت",   s:{fr:"Moi d'abord",ar:"أنا أولاً"},            price:19, c:"#4F6E8A", fg:"#fff",    tag:"fr:Best-seller|ar:الأكثر مبيعاً"},
  {id:2, fr:"Casquette",  ar:"قبعة",     s:{fr:"Sans permission",ar:"بدون إذن"},         price:15, c:"#CFE3D8", fg:"#26343F", tag:"fr:Moins de 20 TND|ar:أقل من 20 د.ت"},
  {id:3, fr:"Sweat",      ar:"سويت",     s:{fr:"Je me suffis",ar:"أكتفي بنفسي"},          price:49, c:"#2F4352", fg:"#fff",    tag:"fr:Le plus porté|ar:الأكثر ارتداءً"},
  {id:4, fr:"Tote bag",   ar:"حقيبة قماش", s:{fr:"Mon temps, mon choix",ar:"وقتي، قراري"}, price:12, c:"#B9CCDA", fg:"#26343F",    tag:"fr:Moins de 15 TND|ar:أقل من 15 د.ت"},
  {id:5, fr:"Carnet",     ar:"دفتر",     s:{fr:"Mes règles",ar:"قواعدي أنا"},             price:9,  c:"#CFE3D8", fg:"#26343F", tag:"fr:Petit prix|ar:سعر صغير"},
  {id:6, fr:"Mug",        ar:"كوب",      s:{fr:"Je m'aime d'abord",ar:"أحبني أولاً"},     price:14, c:"#4F6E8A", fg:"#fff",    tag:"fr:Idée cadeau (pour soi)|ar:هدية (لنفسك)"}
];
const GOVS = ["Ariana","Béja","Ben Arous","Bizerte","Gabès","Gafsa","Jendouba","Kairouan","Kasserine","Kébili","Le Kef","Mahdia","La Manouba","Médenine","Monastir","Nabeul","Sfax","Sidi Bouzid","Siliana","Sousse","Tataouine","Tozeur","Tunis","Zaghouan"];

/* ============ TEXTS ============ */
const T = {
fr:{nav_shop:"Boutique",nav_about:"Manifeste",nav_faq:"Questions",cart:"Panier",
 hero_ego:"Pense à toi d'abord. Ne compte que sur toi. L'égoïsme, version saine.",hero_eco:"Tout à moins de 50 TND. Se choisir ne doit pas coûter cher.",
 cta:"Voir la boutique",cta2:"Notre manifeste",
 t1:"Tout à moins de 50 TND",t2:"Paiement à la livraison",t3:"Livraison dans les 24 gouvernorats",
 about_h:"Être égoïste, c'est se choisir.",
 about_p1:"EGO & ECO, ce sont deux idées. EGO : croire en toi, te mettre en premier, ne rien devoir à l'avis des autres. ECO : l'économie, des prix bas pour que la confiance en soi ne soit pas un luxe.",
 about_p2:"Chaque pièce porte une phrase qui te rappelle qui décide. Petits prix, grande confiance.",
 f1q:"Comment payer ?",f1a:"À la livraison, en espèces, directement au livreur. Aucun paiement en ligne n'est demandé.",
 f2q:"Quels sont les délais et frais de livraison ?",f2a:"Livraison en 2 à 4 jours ouvrables partout en Tunisie. 8 TND, gratuite dès 100 TND d'achat.",
 f3q:"Puis-je échanger un article ?",f3a:"Oui, sous 7 jours si l'article est non porté. Écrivez-nous sur WhatsApp.",
 f4q:"Pourquoi c'est si peu cher ?",f4a:"Petite marge, pas de publicité coûteuse, pas de boutique physique. Le prix reste bas, la qualité reste correcte.",
 foot_tag:"Crois en toi. Petits prix. Vendue en Tunisie.",contact:"Contact",addr:"Tunis, Tunisie",follow:"Suivez-nous",legal:"Prix en dinars tunisiens (TND), TVA incluse.",
 add:"Ajouter au panier",empty:"Votre panier est vide.",sub:"Sous-total",ship:"Livraison",free:"Offerte",total:"Total",
 checkout:"Passer la commande",f_name:"Nom et prénom",f_phone:"Téléphone (8 chiffres)",f_gov:"Gouvernorat",f_addr:"Adresse complète",
 pick:"Choisir…",cod:"Paiement en espèces à la livraison.",order:"Confirmer la commande",
 sent:"Bien joué ! WhatsApp s'ouvre pour envoyer votre commande. Nous vous appelons pour confirmer.",
 wa_hi:"Bonjour EGO & ECO, je souhaite commander :",wa_cl:"Client",wa_ph:"Tél",wa_ad:"Adresse"},
ar:{nav_shop:"المتجر",nav_about:"بيان العلامة",nav_faq:"أسئلة",cart:"السلة",
 hero_ego:"فكّر في نفسك أولاً. اعتمد على نفسك فقط. الأنانية، بشكلها الصحي.",hero_eco:"كل شيء بأقل من 50 د.ت. أن تختار نفسك لا يجب أن يكلّف غالياً.",
 cta:"تصفح المتجر",cta2:"بياننا",
 t1:"كل شيء بأقل من 50 د.ت",t2:"الدفع عند الاستلام",t3:"توصيل إلى 24 ولاية",
 about_h:"أن تكون أنانياً يعني أن تختار نفسك.",
 about_p1:"EGO & ECO فكرتان. EGO: أن تثق بنفسك، وتضعها أولاً، ولا تدين لرأي أحد. ECO: الاقتصاد، أسعار منخفضة حتى لا تكون الثقة بالنفس ترفاً.",
 about_p2:"كل قطعة تحمل جملة تذكّرك من يقرّر. أسعار صغيرة، وثقة كبيرة.",
 f1q:"كيف أدفع؟",f1a:"عند الاستلام نقداً للموزّع مباشرة. لا يُطلب أي دفع إلكتروني.",
 f2q:"ما هي مدة وتكلفة التوصيل؟",f2a:"التوصيل خلال 2 إلى 4 أيام عمل في كامل تونس. 8 د.ت، ومجاني ابتداءً من 100 د.ت.",
 f3q:"هل يمكنني تبديل منتج؟",f3a:"نعم خلال 7 أيام إذا كان المنتج غير مستعمل. راسلنا على واتساب.",
 f4q:"لماذا الأسعار منخفضة هكذا؟",f4a:"هامش ربح صغير، بدون إعلانات مكلفة، وبدون محل. السعر يبقى منخفضاً والجودة مقبولة.",
 foot_tag:"ثق بنفسك. أسعار صغيرة. تُباع في تونس.",contact:"اتصل بنا",addr:"تونس",follow:"تابعنا",legal:"الأسعار بالدينار التونسي (د.ت) مع الأداء على القيمة المضافة.",
 add:"أضف إلى السلة",empty:"سلتك فارغة.",sub:"المجموع الفرعي",ship:"التوصيل",free:"مجاني",total:"المجموع",
 checkout:"إتمام الطلب",f_name:"الاسم واللقب",f_phone:"الهاتف (8 أرقام)",f_gov:"الولاية",f_addr:"العنوان الكامل",
 pick:"اختر…",cod:"الدفع نقداً عند الاستلام.",order:"تأكيد الطلب",
 sent:"أحسنت! سيتم فتح واتساب لإرسال طلبك. سنتصل بك للتأكيد.",
 wa_hi:"مرحباً EGO & ECO، أريد طلب:",wa_cl:"الحريف",wa_ph:"الهاتف",wa_ad:"العنوان"}
};

/* ============ STATE ============ */
let lang = "fr", cart = {};
try{ lang = localStorage.getItem("lang") || "fr"; cart = JSON.parse(localStorage.getItem("cart")||"{}"); }catch(e){}
const $ = s => document.querySelector(s), t = k => T[lang][k];
const tnd = n => n.toFixed(3).replace(".",",") + (lang==="ar" ? " د.ت" : " TND");
const save = () => { try{ localStorage.setItem("cart",JSON.stringify(cart)); localStorage.setItem("lang",lang);}catch(e){} };

/* ============ RENDER ============ */
function render(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang==="ar" ? "rtl" : "ltr";
  $("#langBtn").textContent = lang==="ar" ? "Français" : "العربية";
  document.querySelectorAll("[data-i]").forEach(e => e.textContent = t(e.dataset.i));

  $("#products").innerHTML = PRODUCTS.map(p => {
    const tag = Object.fromEntries(p.tag.split("|").map(x=>x.split(":")))[lang];
    return `<article class="card"><div class="pic" style="background:${p.c};color:${p.fg}">${p.s[lang]}<span class="badge">${tnd(p.price)}</span></div>
      <div class="in"><span class="tag">${tag}</span><h3>${p[lang]}</h3>
      <span class="price">${tnd(p.price)}</span>
      <button class="btn" onclick="add(${p.id})">${t("add")}</button></div></article>`;
  }).join("");

  $("#gov").innerHTML = `<option value="">${t("pick")}</option>` + GOVS.map(g=>`<option>${g}</option>`).join("");
  renderCart();
}

function totals(){
  const sub = Object.entries(cart).reduce((s,[id,q]) => s + PRODUCTS.find(p=>p.id==id).price*q, 0);
  const ship = sub===0 ? 0 : (sub>=FREE_SHIPPING_FROM ? 0 : SHIPPING);
  return {sub, ship, total: sub+ship};
}

function renderCart(){
  const ids = Object.keys(cart);
  $("#count").textContent = ids.reduce((s,i)=>s+cart[i],0);
  $("#dtitle").textContent = t("cart");
  $("#cartBody").innerHTML = ids.length ? ids.map(id => {
    const p = PRODUCTS.find(x=>x.id==id);
    return `<div class="line"><span class="n">${p[lang]}<br><small>${tnd(p.price)}</small></span>
      <span class="q"><button onclick="chg(${id},-1)" aria-label="-">−</button><b>${cart[id]}</b><button onclick="chg(${id},1)" aria-label="+">+</button></span></div>`;
  }).join("") : `<p>${t("empty")}</p>`;
  const x = totals();
  $("#sum").innerHTML = ids.length ? `
    <div><span>${t("sub")}</span><span>${tnd(x.sub)}</span></div>
    <div><span>${t("ship")}</span><span>${x.ship?tnd(x.ship):t("free")}</span></div>
    <div class="tot"><span>${t("total")}</span><span>${tnd(x.total)}</span></div>` : "";
  $("#form").hidden = !ids.length;
  save();
}

/* ============ ACTIONS ============ */
function add(id){ cart[id]=(cart[id]||0)+1; renderCart(); openCart(); }
function chg(id,d){ cart[id]+=d; if(cart[id]<=0) delete cart[id]; renderCart(); }
function openCart(){ $("#drawer").classList.add("open"); $("#ov").classList.add("open"); $("#msg").textContent=""; }
function closeCart(){ $("#drawer").classList.remove("open"); $("#ov").classList.remove("open"); }

$("#cartBtn").onclick = openCart;
$("#close").onclick = closeCart;
$("#ov").onclick = closeCart;
document.addEventListener("keydown", e => e.key==="Escape" && closeCart());
$("#langBtn").onclick = () => { lang = lang==="fr" ? "ar" : "fr"; render(); };

$("#form").onsubmit = e => {
  e.preventDefault();
  const f = new FormData(e.target), x = totals();
  const lines = Object.entries(cart).map(([id,q]) => {
    const p = PRODUCTS.find(p=>p.id==id); return `• ${q} × ${p[lang]} — ${tnd(p.price*q)}`;
  }).join("\n");
  const text = `${t("wa_hi")}\n${lines}\n\n${t("ship")}: ${x.ship?tnd(x.ship):t("free")}\n${t("total")}: ${tnd(x.total)}\n\n` +
    `${t("wa_cl")}: ${f.get("name")}\n${t("wa_ph")}: +216 ${f.get("phone")}\n${t("f_gov")}: ${f.get("gov")}\n${t("wa_ad")}: ${f.get("addr")}`;
  window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(text)}`, "_blank");
  $("#msg").textContent = t("sent");
  cart = {}; renderCart(); e.target.reset();
};

render();
</script>
